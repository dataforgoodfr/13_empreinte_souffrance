services:
  traefik:
    image: traefik:v3.7.16
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.dashboard.rule=Host(${HOST_URL})"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.routers.dashboard.entrypoints=websecure"
        - "traefik.http.routers.dashboard.tls.certresolver=httpresolver"
        - "traefik.http.routers.dashboard.tls.domains[0].main=${HOST_URL}"
        - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
        - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_CREDENTIALS}"
        - "traefik.http.services.traefik.loadbalancer.server.port=8080"
        - "traefik.http.routers.http-catchall.rule=HostRegexp(`.+`)"
        - "traefik.http.routers.http-catchall.entrypoints=web"
        - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
        - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
        - "traefik.http.routers.www-redirect.rule=Host(`www.${DOMAIN}`)"
        - "traefik.http.routers.www-redirect.entrypoints=websecure"
        - "traefik.http.routers.www-redirect.tls=true"
        - "traefik.http.routers.www-redirect.tls.certresolver=httpresolver"
        - "traefik.http.routers.www-redirect.middlewares=redirect-www-to-naked"
        - "traefik.http.middlewares.redirect-www-to-naked.redirectregex.regex=^https://www\\.(.+)"
        - "traefik.http.middlewares.redirect-www-to-naked.redirectregex.replacement=https://$${1}"
        - "traefik.http.middlewares.redirect-www-to-naked.redirectregex.permanent=true"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.swarm=true"
      - "--providers.swarm.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.httpresolver.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.httpresolver.acme.storage=/certificates/acme-http.json"
      - "--certificatesresolvers.httpresolver.acme.httpchallenge.entrypoint=web"
      - "--api.dashboard=true"
    volumes:
      - traefik-certificates:/certificates
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-public
    ports:
      - "80:80"
      - "443:443"

volumes:
  traefik-certificates:

networks:
  traefik-public:
    external: true
